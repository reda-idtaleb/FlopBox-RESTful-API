spring:
  application:
    name: flopbox-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flopbox}
    username: ${DATABASE_USERNAME:flopbox}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:flopbox-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  ftp:
    connect-timeout: ${FTP_CONNECT_TIMEOUT:PT10S}
    socket-timeout: ${FTP_SOCKET_TIMEOUT:PT30S}
    max-tree-depth: ${FTP_MAX_TREE_DEPTH:5}
    allow-private-addresses: ${FTP_ALLOW_PRIVATE_ADDRESSES:false}
